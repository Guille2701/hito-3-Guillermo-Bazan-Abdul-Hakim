<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot IA - Hito 3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #e5ddd5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #chat-container { width: 100%; max-width: 450px; height: 80vh; background: #ece5dd; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; }
        
        #header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px;}
        #header span { font-size: 0.8rem; background: #25d366; padding: 2px 8px; border-radius: 10px; }
        
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; position: relative; animation: fadeIn 0.3s ease-in-out;}
        .msg.user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg.bot { background: white; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        
        #input-area { display: flex; padding: 10px; background: #f0f0f0; gap: 10px; }
        
        /* Nuevos estilos para cuando el botón o texto estén bloqueados */
        #msg-input { flex: 1; padding: 12px 15px; border: none; border-radius: 25px; outline: none; font-size: 1rem; box-shadow: 0 1px 1px rgba(0,0,0,0.1); transition: background 0.3s;}
        #msg-input:disabled { background: #e0e0e0; color: #888; }
        
        #send-btn { background: #008f68; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 1px 1px rgba(0,0,0,0.1); transition: all 0.2s; }
        #send-btn:hover { background: #007555; }
        #send-btn:disabled { background: #aaa; cursor: not-allowed; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="header">🤖 Asistente IA <span>En línea</span></div>
        <div id="messages">
            <div class="msg bot">¡Hola! Soy tu asistente virtual. Puedes preguntarme por el clima, datos de países, resúmenes de Wikipedia o pedirme que te cuente un chiste. ¿En qué te ayudo?</div>
        </div>
        <div id="input-area">
            <input type="text" id="msg-input" placeholder="Escribe un mensaje..." onkeypress="handleEnter(event)">
            <button id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // Esta variable nos avisa de si el bot está pensando
        let isWaiting = false;

        async function sendMessage() {
            // Si ya estamos esperando una respuesta, ignoramos cualquier clic extra
            if (isWaiting) return;

            const input = document.getElementById('msg-input');
            const btn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            // 1. Mostrar el mensaje del usuario
            addMessage(text, 'user');
            input.value = '';

            // 2. BLOQUEAR la interfaz para que el usuario no envíe más mensajes
            isWaiting = true;
            input.disabled = true;
            btn.disabled = true;
            input.placeholder = "Esperando respuesta...";

            // 3. Mostrar el indicador de "Escribiendo..."
            const typingId = addMessage('✍️ Escribiendo...', 'bot');

            try {
                const response = await fetch('http://localhost:5678/webhook-test/chatbot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensaje: text })
                });

                if (!response.ok) throw new Error('Error en la red');

                const data = await response.text(); 
                
                // Asegurarnos de borrar el "Escribiendo..." antes de poner la respuesta final
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove(); 
                
                addMessage(data, 'bot');

            } catch (error) {
                const typingElement = document.getElementById(typingId);
                if (typingElement) typingElement.remove();
                
                addMessage('❌ Error: No se pudo conectar con n8n. Revisa tu Webhook.', 'bot');
            } finally {
                // 4. DESBLOQUEAR la interfaz pase lo que pase (haya éxito o error)
                isWaiting = false;
                input.disabled = false;
                btn.disabled = false;
                input.placeholder = "Escribe un mensaje...";
                input.focus(); // Volver a poner el cursor listo para escribir
            }
        }

        function addMessage(text, sender) {
            const msgsDiv = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${sender}`;
            msgDiv.textContent = text;
            const id = 'msg-' + Date.now();
            msgDiv.id = id;
            msgsDiv.appendChild(msgDiv);
            msgsDiv.scrollTop = msgsDiv.scrollHeight; // Auto-scroll hacia abajo
            return id;
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>

</body>
</html>
